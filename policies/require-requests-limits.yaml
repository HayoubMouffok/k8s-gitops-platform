apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/description: Requests et limits CPU/mémoire obligatoires.
spec:
  background: true
  rules:
    - name: require-requests-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [demo]
      validate:
        failureAction: Enforce
        message: "Requests et limits CPU/mémoire obligatoires."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
