name: ci
on:
  push:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Helm lint
        run: helm lint charts/demo-app
      - name: Validation des manifests (kubeconform)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          helm template demo charts/demo-app | ./kubeconform -strict -ignore-missing-schemas -summary
      - name: Terraform fmt / validate
        working-directory: terraform
        run: terraform fmt -check && terraform init -backend=false && terraform validate
      - name: Scan de sécurité IaC (Trivy)
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.1 config --severity HIGH,CRITICAL --exit-code 1 /src/charts

  e2e:
    name: Déploiement GitOps de bout en bout (kind)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: gitops
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Bootstrap Argo CD (Terraform)
        working-directory: terraform
        run: terraform init && terraform apply -auto-approve -var "git_revision=${{ github.sha }}"
      - name: Tests de bout en bout
        run: bash tests/e2e.sh
      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          kubectl get applications -n argocd -o wide || true
          kubectl get pods -A || true
          kubectl -n argocd get applications -o json | jq '.items[] | {name: .metadata.name, conditions: .status.conditions, op: .status.operationState.message}' || true
